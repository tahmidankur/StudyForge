<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Study · Study Forge</title>
  <meta name="theme-color" content="#fff8f5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1b1412" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="icon.svg" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Study Forge" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="stylesheet" href="style.css" />
  <script src="script.js"></script>
</head>
<body>

  <header class="topbar">
    <div class="container">
      <a href="index.html" class="brand">
        <img src="icon.svg" alt="" />
        <span>Study <span class="brand-accent">Forge</span></span>
      </a>
      <nav class="nav">
        <a href="dashboard.html" class="active">Study</a>
        <a href="reflect.html">Reflect</a>
        <button class="theme-btn" id="theme-btn" aria-label="Toggle dark mode">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="container">

      <div class="page-intro">
        <p class="date" id="today-date"></p>
        <h1 id="greeting">Hello!</h1>
      </div>

      <!-- Today's numbers -->
      <div class="stats">
        <div class="stat">
          <div class="stat-value" id="stat-tasks">0</div>
          <div class="stat-label">Tasks today</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="stat-focus">0</div>
          <div class="stat-label">Focus today</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="stat-streak">0</div>
          <div class="stat-label">Day streak</div>
        </div>
      </div>

      <div class="dashboard-grid">

        <!-- TASKS -->
        <section class="card">
          <div class="card-title">
            <h2>My tasks</h2>
          </div>

          <form id="task-form" class="task-form">
            <div class="full">
              <label for="task-title">What do you need to do?</label>
              <input type="text" id="task-title" placeholder="e.g. Read chapter 4" required />
            </div>
            <div>
              <label for="task-course">Course</label>
              <input type="text" id="task-course" placeholder="e.g. CS 101" />
            </div>
            <div>
              <label for="task-priority">Priority</label>
              <select id="task-priority">
                <option>Low</option>
                <option selected>Medium</option>
                <option>High</option>
              </select>
            </div>
            <div class="due">
              <label for="task-due">Due date</label>
              <input type="date" id="task-due" />
            </div>
            <button type="submit" class="btn btn-primary full">+ Add task</button>
          </form>

          <div class="filters" id="task-filters">
            <button class="filter active" data-filter="all">All</button>
            <button class="filter" data-filter="todo">To do</button>
            <button class="filter" data-filter="done">Done</button>
          </div>

          <ul class="task-list" id="task-list"></ul>
        </section>

        <div class="side-column">

          <!-- FOCUS TIMER -->
          <section class="card" id="timer-card">
            <div class="card-title">
              <h2>Focus timer</h2>
              <div class="modes">
                <button class="mode active" data-mode="focus">Focus</button>
                <button class="mode" data-mode="break">Break</button>
              </div>
            </div>

            <div class="timer-ring">
              <svg viewBox="0 0 200 200">
                <circle class="ring-track" cx="100" cy="100" r="90" />
                <circle class="ring-progress" id="timer-ring" cx="100" cy="100" r="90" />
              </svg>
              <div class="timer-center">
                <div class="timer-time" id="timer-time">25:00</div>
                <div class="muted" id="timer-status">Ready</div>
              </div>
            </div>

            <div class="timer-buttons">
              <button class="btn btn-primary" id="timer-start">Start</button>
              <button class="btn btn-secondary" id="timer-reset">Reset</button>
            </div>
            <p class="timer-note">Focus for 25 minutes, then take a 5 minute break.</p>
          </section>

          <!-- PROGRESS -->
          <section class="card">
            <div class="card-title">
              <h2>Daily goal</h2>
              <strong id="goal-percent">0%</strong>
            </div>
            <div class="goal-bar"><div class="goal-fill" id="goal-fill"></div></div>
            <p class="muted" style="font-size: 0.85rem;">Goal: finish 3 tasks and 4 focus sessions.</p>

            <h3 style="margin-top: 24px;">Last 7 days</h3>
            <div class="chart" id="week-chart"></div>
          </section>

        </div>
      </div>
    </div>
  </main>

</body>
</html>
