<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tasks — StudyForge</title>
  <meta name="theme-color" content="#6b5bd2" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <a href="dashboard.html" class="brand">
      <span class="brand-mark">F</span>
      <span>StudyForge</span>
    </a>
    <div class="topbar-actions">
      <button class="icon-btn" data-export aria-label="Export data">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button class="icon-btn" data-theme-toggle aria-label="Toggle dark mode"></button>
    </div>
  </header>

  <main class="page">
    <div class="container">

      <div class="greeting fade-up">
        <span class="eyebrow">Task manager</span>
        <h1 style="margin-top: 0.5rem;">What's on your plate?</h1>
        <p>Capture every assignment, reading, and review session. One task at a time.</p>
      </div>

      <!-- Add Task form -->
      <div class="card fade-up fade-up-1" style="margin-bottom: 1.25rem;">
        <div class="card-header">
          <h2>Add a task</h2>
        </div>
        <form id="task-form" class="task-form">
          <div class="field">
            <label for="task-title">Task title</label>
            <input type="text" id="task-title" name="title" placeholder="e.g. Read Chapter 4 of CS textbook" required />
          </div>
          <div class="field-row">
            <div class="field">
              <label for="task-course">Course</label>
              <input type="text" id="task-course" name="course" placeholder="e.g. CS 101" />
            </div>
            <div class="field">
              <label for="task-priority">Priority</label>
              <select id="task-priority" name="priority">
                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="task-due">Due date (optional)</label>
            <input type="date" id="task-due" name="dueDate" />
          </div>
          <button type="submit" class="btn btn-primary btn-block">+ Add task</button>
        </form>
      </div>

      <!-- Filter chips -->
      <div class="task-filters fade-up fade-up-2" id="task-filters">
        <button class="filter-chip active" data-filter="all">All</button>
        <button class="filter-chip" data-filter="active">Active</button>
        <button class="filter-chip" data-filter="high">High priority</button>
        <button class="filter-chip" data-filter="completed">Completed</button>
      </div>

      <!-- Task list -->
      <ul id="task-list" class="task-list fade-up fade-up-3"></ul>

    </div>
  </main>

  <nav class="bottom-nav" aria-label="Primary">
    <a href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l2-2 7-7 7 7 2 2"/><path d="M5 10v10a1 1 0 001 1h12a1 1 0 001-1V10"/></svg>Home</a>
    <a href="tasks.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>Tasks</a>
    <a href="timer.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Timer</a>
    <a href="progress.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><polyline points="7 14 11 10 15 14 21 8"/></svg>Progress</a>
    <a href="journal.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Journal</a>
  </nav>

  <script src="script.js"></script>
</body>
</html>
