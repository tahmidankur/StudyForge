<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#201b46"/>
      <stop offset="100%" stop-color="#0d0a20"/>
    </linearGradient>
    <linearGradient id="lp" gradientUnits="userSpaceOnUse" x1="248" y1="245" x2="102" y2="430">
      <stop offset="0%" stop-color="#f0ecfc"/>
      <stop offset="100%" stop-color="#cec6ee"/>
    </linearGradient>
    <linearGradient id="rp" gradientUnits="userSpaceOnUse" x1="256" y1="430" x2="408" y2="242">
      <stop offset="0%" stop-color="#5040be"/>
      <stop offset="55%" stop-color="#7262d4"/>
      <stop offset="100%" stop-color="#9e8fef"/>
    </linearGradient>
    <linearGradient id="wp" gradientUnits="userSpaceOnUse" x1="350" y1="298" x2="408" y2="66">
      <stop offset="0%" stop-color="#7060d0"/>
      <stop offset="100%" stop-color="#ccc4ff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="wispglow" x="-40%" y="-20%" width="180%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Book cover base -->
  <path d="M 104 428 Q 256 448 408 428 L 408 455 Q 256 475 104 455 Z"
        fill="#221e54" opacity="0.9"/>

  <!-- Left page shadow -->
  <path d="M 258 434
           C 235 418 144 389 93 326
           C 64 291 69 251 103 237
           C 138 223 202 253 247 305
           C 258 322 261 398 258 434 Z"
        fill="#171350"/>

  <!-- Left page -->
  <path d="M 256 430
           C 234 414 148 387 100 327
           C 73 294 78 256 111 244
           C 144 232 206 261 247 310
           C 257 327 258 394 256 430 Z"
        fill="url(#lp)"/>

  <!-- Right page shadow -->
  <path d="M 254 434
           C 277 416 368 387 419 324
           C 448 289 443 249 409 235
           C 374 221 310 251 265 303
           C 257 320 253 398 254 434 Z"
        fill="#171350"/>

  <!-- Right page -->
  <path d="M 256 430
           C 276 414 365 385 413 325
           C 440 291 435 253 403 241
           C 369 229 307 258 265 307
           C 257 323 256 394 256 430 Z"
        fill="url(#rp)"/>

  <!-- Wisp tail -->
  <path d="M 350 298
           C 364 262 388 222 398 186
           C 408 152 406 116 406 76"
        stroke="url(#wp)" stroke-width="26" fill="none"
        stroke-linecap="round" filter="url(#wispglow)"/>

  <!-- 4-pointed star at wisp tip -->
  <path d="M 406,44 L 415,64 L 436,72 L 415,80 L 406,100 L 397,80 L 376,72 L 397,64 Z"
        fill="url(#wp)" filter="url(#glow)"/>

  <!-- Large sparkle -->
  <path d="M 220,202 L 225,216 L 239,221 L 225,226 L 220,240 L 215,226 L 201,221 L 215,216 Z"
        fill="#c4bcff" filter="url(#glow)"/>

  <!-- Small sparkle -->
  <path d="M 265,260 L 268.5,269 L 278,272 L 268.5,275 L 265,284 L 261.5,275 L 252,272 L 261.5,269 Z"
        fill="#b0a8f8" opacity="0.88"/>
</svg>
