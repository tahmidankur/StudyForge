<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Reflect · Study Forge</title>
  <meta name="theme-color" content="#fff8f5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1b1412" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="icon.svg" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Study Forge" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="stylesheet" href="style.css" />
  <script src="script.js"></script>
</head>
<body>

  <header class="topbar">
    <div class="container">
      <a href="index.html" class="brand">
        <img src="icon.svg" alt="" />
        <span>Study <span class="brand-accent">Forge</span></span>
      </a>
      <nav class="nav">
        <a href="dashboard.html">Study</a>
        <a href="reflect.html" class="active">Reflect</a>
        <button class="theme-btn" id="theme-btn" aria-label="Toggle dark mode">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="container">

      <div class="page-intro">
        <p class="date" id="today-date"></p>
        <h1>How was today?</h1>
        <p class="muted">Check in with your mood and write a few lines about your day.</p>
      </div>

      <div class="reflect-grid">

        <!-- MOOD -->
        <section class="card">
          <div class="card-title">
            <h2>I'm feeling…</h2>
          </div>
          <div class="moods" id="moods">
            <button class="mood" data-mood="Motivated"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0011 12c0-1.4-.5-2-1-3-1.1-2.1-.2-4 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 11-14 0c0-1.2.4-2.3 1-3.3.3 1.2 1.2 2.3 2.5 2.8z"/></svg>Motivated</button>
            <button class="mood" data-mood="Focused"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>Focused</button>
            <button class="mood" data-mood="Tired"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>Tired</button>
            <button class="mood" data-mood="Stressed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 16.6A5 5 0 0018 7h-1.3A8 8 0 104 15.3"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/></svg>Stressed</button>
          </div>
          <p class="mood-message" id="mood-message" hidden></p>
        </section>

        <!-- JOURNAL -->
        <section class="card">
          <div class="card-title">
            <h2>Today's journal</h2>
            <span class="saved-note" id="saved-note">Saved</span>
          </div>
          <label for="journal-text">What did you learn? What will you do tomorrow?</label>
          <textarea id="journal-text" placeholder="Start typing… it saves by itself."></textarea>
        </section>

        <!-- PAST ENTRIES -->
        <section class="card" id="past-entries-card" hidden>
          <div class="card-title">
            <h2>Past entries</h2>
          </div>
          <div id="past-entries"></div>
        </section>

      </div>
    </div>
  </main>

</body>
</html>
